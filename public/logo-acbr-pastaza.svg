<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="100%" height="100%">
  <defs>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Hand Cuff (Navy Blue) -->
    <path d="M 12 110 L 25 110 L 20 145 L 7 145 Z" fill="#1A365D" stroke="#0F172A" stroke-width="2"/>
    <line x1="25" y1="110" x2="20" y2="145" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Hand & Fingers (Skin tone #E0A97E) -->
    <path d="M 25 116 
             C 45 118, 65 125, 95 130 
             C 105 131, 112 126, 115 120 
             C 117 114, 110 110, 98 108 
             L 75 106 
             C 90 105, 102 102, 108 97 
             C 112 93, 107 89, 95 90 
             L 72 92 
             C 82 89, 92 84, 94 80 
             C 96 76, 90 73, 80 75 
             L 60 82 
             C 50 86, 35 96, 25 116 Z" 
          fill="#EDB68E" stroke="#5D3A1A" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Thumb -->
    <path d="M 38 104 C 42 92, 50 85, 58 87 C 62 89, 60 96, 52 102 Z" fill="#EDB68E" stroke="#5D3A1A" stroke-width="2"/>

    <!-- Hand Palm Crease Detail -->
    <path d="M 50 112 C 65 115, 80 118, 92 120" stroke="#C98B60" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Left Building (Medium) -->
    <path d="M 35 65 L 48 55 L 48 100 L 35 102 Z" fill="url(#buildingGrad)" stroke="#C83803" stroke-width="1.5"/>
    <!-- Left building windows -->
    <line x1="39" y1="68" x2="44" y2="65" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="39" y1="75" x2="44" y2="72" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="39" y1="82" x2="44" y2="79" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="39" y1="89" x2="44" y2="86" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Center Building (Tallest) -->
    <path d="M 50 25 L 75 32 L 75 95 L 50 92 Z" fill="url(#buildingGrad)" stroke="#C83803" stroke-width="1.5"/>
    <!-- Angled Roof Top Cut -->
    <path d="M 50 25 L 62 15 L 75 32 Z" fill="#FF8A65" stroke="#C83803" stroke-width="1.5"/>
    <!-- Center windows grid -->
    <line x1="56" y1="36" x2="69" y2="39" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="56" y1="46" x2="69" y2="49" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="56" y1="56" x2="69" y2="59" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="56" y1="66" x2="69" y2="69" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="56" y1="76" x2="69" y2="79" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="56" y1="86" x2="69" y2="89" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Right Building (Shorter) -->
    <path d="M 77 60 L 89 63 L 89 95 L 77 92 Z" fill="url(#buildingGrad)" stroke="#C83803" stroke-width="1.5"/>
    <line x1="80" y1="69" x2="86" y2="71" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="80" y1="77" x2="86" y2="79" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="80" y1="85" x2="86" y2="87" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Vertical Cyan Divider Line -->
    <line x1="126" y1="18" x2="126" y2="120" stroke="#00A3E0" stroke-width="5" stroke-linecap="round"/>

    <!-- ACBR Typography -->
    <text x="140" y="60" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" fill="#00A3E0" letter-spacing="1">ACBR</text>

    <!-- PASTAZA Typography -->
    <text x="140" y="105" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="39" font-weight="900" fill="#00A3E0" letter-spacing="2">PASTAZA</text>

    <!-- Subtitle: Tu Sede INMOBILIARIA -->
    <g transform="translate(18, 150)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B" letter-spacing="1.5">
        Tu Sede <tspan font-weight="900" letter-spacing="3">INMOBILIARIA</tspan>
      </text>
    </g>
  </g>
</svg>
